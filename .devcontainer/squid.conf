# Egress-Proxy des Containers. Filtert nach Namen, nicht nach Adressen.
#
# Der Agent erreicht das Netz ausschliesslich hierüber: die Firewall lässt
# ausgehenden Verkehr nur für den Benutzer proxy zu. Damit gilt die Allowlist
# auch für Verbindungen zu einer rohen IP-Adresse, was eine Firewall mit
# Adresslisten nicht leisten kann.

http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all

# Kein Cache, kein Zustand auf der Platte.
cache deny all

# Keine Weitergabe interner Namen und Adressen nach aussen.
forwarded_for delete
via off

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid
